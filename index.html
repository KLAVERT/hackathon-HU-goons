<!DOCTYPE html>
<!-- biome-ignore lint/a11y/useValidLang: %LOCALE% is replaced at build time in vite.config.ts -->
<html lang="%LOCALE%">
	<head>
		<meta charset="UTF-8" />
		<link
			rel="icon"
			type="image/svg+xml"
			href="/favicon.svg" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0" />
		<!-- Boot preloader: inline so it shows before any JS is downloaded. Removed by lib/preloader.ts -->
		<style>
			#preloader {
				position: fixed;
				inset: 0;
				z-index: 100;
				display: grid;
				place-items: center;
				background: #fff;
				transition:
					opacity 0.4s ease,
					visibility 0.4s;
			}
			#preloader.is-done {
				opacity: 0;
				visibility: hidden;
			}
			#preloader .hu-loader {
				width: min(96px, 28vw);
			}
			/* Shared with components/hu-loader, which sets its own size */
			.hu-loader {
				overflow: visible;
				/* Fast loads finish before this delay, so the loader never flashes */
				animation: hu-appear 0.4s ease 0.15s both;
			}
			.hu-loader .bar,
			.hu-loader .u {
				animation: 2.6s cubic-bezier(0.65, 0, 0.35, 1) infinite both;
			}
			.hu-loader .bar-l {
				animation-name: hu-rise;
			}
			.hu-loader .bar-tr {
				animation-name: hu-drop;
				animation-delay: 0.12s;
			}
			.hu-loader .bar-br {
				animation-name: hu-rise;
				animation-delay: 0.24s;
			}
			.hu-loader .u {
				stroke-dasharray: 1 1;
				animation-name: hu-draw;
				animation-delay: 0.3s;
			}
			/* Every stroke leaves the way it came in, like a pen passing through */
			@keyframes hu-rise {
				0% { clip-path: inset(100% 0 0 0); }
				35%, 70% { clip-path: inset(0); }
				100% { clip-path: inset(0 0 100% 0); }
			}
			@keyframes hu-drop {
				0% { clip-path: inset(0 0 100% 0); }
				35%, 70% { clip-path: inset(0); }
				100% { clip-path: inset(100% 0 0 0); }
			}
			@keyframes hu-draw {
				0% { stroke-dashoffset: 1; }
				35%, 70% { stroke-dashoffset: 0; }
				100% { stroke-dashoffset: -1; }
			}
			@keyframes hu-appear {
				from { opacity: 0; }
			}
			@keyframes hu-breathe {
				to { opacity: 0.4; }
			}
			@media (prefers-reduced-motion: reduce) {
				.hu-loader * {
					animation: none !important;
				}
				.hu-loader {
					animation: hu-breathe 1.2s ease-in-out infinite alternate;
				}
			}
		</style>
	</head>
	<body>
		<div id="preloader" role="status" aria-label="Bezig met laden / Loading">
			<svg class="hu-loader" viewBox="0 0 51.4 44" aria-hidden="true">
				<g fill="#00A1E1">
					<rect class="bar bar-l" x="0.18" y="0.263" width="7.29" height="43.621" />
					<rect class="bar bar-tr" x="14.76" y="0.263" width="7.291" height="18.174" />
					<rect class="bar bar-br" x="14.76" y="25.708" width="7.291" height="18.176" />
				</g>
				<!-- The U as a single centerline stroke, so it can be drawn -->
				<path
					class="u"
					pathLength="1"
					d="M32.989 0.263V22.073A7.2915 7.2915 0 0 0 47.572 22.073V0.263"
					fill="none"
					stroke="#E6302B"
					stroke-width="7.29" />
			</svg>
		</div>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
