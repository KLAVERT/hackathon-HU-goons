<!DOCTYPE html>
<!-- biome-ignore lint/a11y/useValidLang: %LOCALE% is replaced at build time in vite.config.ts -->
<html lang="%LOCALE%">
	<head>
		<meta charset="UTF-8" />
		<link
			rel="icon"
			type="image/svg+xml"
			href="/favicon.svg" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0" />
		<!-- Boot preloader: inline so it shows before any JS is downloaded. Removed by lib/preloader.ts -->
		<style>
			#preloader {
				position: fixed;
				inset: 0;
				z-index: 100;
				display: grid;
				place-items: center;
				background: #fff;
				transition:
					opacity 0.4s ease,
					visibility 0.4s;
			}
			#preloader.is-done {
				opacity: 0;
				visibility: hidden;
			}
			.hu-loader {
				width: min(240px, 64vw);
				overflow: visible;
				/* Fast loads finish before this delay, so the loader never flashes */
				animation: hu-appear 0.4s ease 0.15s both;
			}
			.hu-loader .bar,
			.hu-loader .u {
				animation: 2.6s cubic-bezier(0.65, 0, 0.35, 1) infinite both;
			}
			.hu-loader .bar-l {
				animation-name: hu-rise;
			}
			.hu-loader .bar-tr {
				animation-name: hu-drop;
				animation-delay: 0.12s;
			}
			.hu-loader .bar-br {
				animation-name: hu-rise;
				animation-delay: 0.24s;
			}
			.hu-loader .u {
				stroke-dasharray: 1 1;
				animation-name: hu-draw;
				animation-delay: 0.3s;
			}
			.hu-loader .wordmark {
				animation: hu-wipe 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.8s both;
			}
			/* Every stroke leaves the way it came in, like a pen passing through */
			@keyframes hu-rise {
				0% { clip-path: inset(100% 0 0 0); }
				35%, 70% { clip-path: inset(0); }
				100% { clip-path: inset(0 0 100% 0); }
			}
			@keyframes hu-drop {
				0% { clip-path: inset(0 0 100% 0); }
				35%, 70% { clip-path: inset(0); }
				100% { clip-path: inset(100% 0 0 0); }
			}
			@keyframes hu-draw {
				0% { stroke-dashoffset: 1; }
				35%, 70% { stroke-dashoffset: 0; }
				100% { stroke-dashoffset: -1; }
			}
			@keyframes hu-wipe {
				from { clip-path: inset(0 100% 0 0); transform: translateX(-4px); }
				to { clip-path: inset(0); transform: none; }
			}
			@keyframes hu-appear {
				from { opacity: 0; }
			}
			@keyframes hu-breathe {
				to { opacity: 0.4; }
			}
			@media (prefers-reduced-motion: reduce) {
				.hu-loader * {
					animation: none !important;
				}
				.hu-loader {
					animation: hu-breathe 1.2s ease-in-out infinite alternate;
				}
			}
		</style>
	</head>
